<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Profile Questionnaire | Drishti-किरण</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #0d9488;
            --primary-light: #ccfbf1;
            --accent: #5eead4;
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#cbd5e1 0.8px, transparent 0.8px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Hero Header */
        header {
            background: linear-gradient(135deg, rgba(15, 118, 110, 0.95) 0%, rgba(6, 78, 59, 0.98) 100%), 
                        url('https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1600&q=80') center/cover;
            color: white;
            padding: 40px 20px 60px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .brand-title { font-size: 2.5rem; font-weight: 700; margin-bottom: 5px; }
        .hindi-kiran { font-family: 'Kalam', cursive; color: var(--accent); }
        .subtitle { font-size: 1.05rem; color: #ccfbf1; font-weight: 300; }

        /* Step Progress Bar */
        .stepper-container {
            max-width: 650px;
            margin: -30px auto 30px auto;
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 10;
            border: 1px solid #e2e8f0;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .step-item.active {
            color: var(--primary);
        }

        .step-badge {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e2e8f0;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .step-item.active .step-badge {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 10px rgba(15, 118, 110, 0.4);
        }

        .step-line {
            flex-grow: 1;
            height: 3px;
            background: #e2e8f0;
            margin: 0 15px;
            border-radius: 2px;
        }

        /* Questionnaire Form Card */
        .container {
            max-width: 780px;
            margin: 0 auto 50px auto;
            padding: 0 20px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
            padding: 40px;
        }

        .card-title {
            font-size: 1.6rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .card-desc {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.93rem;
            margin-bottom: 35px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.93rem;
            color: var(--text-main);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 1.1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            padding: 13px 14px 13px 42px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
            background: #ffffff;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(15, 118, 110, 0.25);
            transition: all 0.2s ease;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.35);
            background: linear-gradient(135deg, #0d9488 0%, #0f766e 100%);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>

    <!-- Hero Header -->
    <header>
        <h1 class="brand-title">Drishti-<span class="hindi-kiran">किरण</span></h1>
        <p class="subtitle">Clinical Tele-Ophthalmology & Risk Evaluation</p>
    </header>

    <!-- Stepper Navigation -->
    <div class="stepper-container">
        <div class="step-item">
            <div class="step-badge">✓</div>
            <span>Patient Intake</span>
        </div>
        <div class="step-line" style="background: var(--primary);"></div>
        <div class="step-item active">
            <div class="step-badge">2</div>
            <span>Health Profile</span>
        </div>
        <div class="step-line"></div>
        <div class="step-item">
            <div class="step-badge">3</div>
            <span>AI Dashboard</span>
        </div>
    </div>

    <!-- Questionnaire Container -->
    <main class="container">
        <div class="card">
            <h2 class="card-title">Medical Profile Questionnaire</h2>
            <p class="card-desc">Please answer these key clinical questions to help personalize your diabetic retinopathy risk assessment.</p>

            <form action="{{ url_for('health_profile') }}" method="POST">
                
                <!-- Hypertension Question -->
                <div class="form-group">
                    <label>🫀 Do you have high blood pressure (Hypertension)?</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🩺</span>
                        <select class="form-control" name="hypertension" required>
                            <option value="">Select an option</option>
                            <option value="Yes">Yes (Diagnosed & Treated)</option>
                            <option value="Yes - Uncontrolled">Yes (Uncontrolled / Borderline)</option>
                            <option value="No">No / Normal Blood Pressure</option>
                            <option value="Unsure">Unsure</option>
                        </select>
                    </div>
                </div>

                <!-- Previous Eye Examination -->
                <div class="form-group">
                    <label>👁️ Have you had a diabetic eye examination before?</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔍</span>
                        <select class="form-control" name="prev_exam" required>
                            <option value="">Select an option</option>
                            <option value="Yes - Within 1 Year">Yes, within the last 1 year</option>
                            <option value="Yes - Over 1 Year">Yes, more than 1 year ago</option>
                            <option value="No">No, this is my first screening</option>
                        </select>
                    </div>
                </div>

                <!-- Current Vision Concerns -->
                <div class="form-group">
                    <label>👓 Do you currently have any vision concerns (e.g. blurry vision, floaters)?</label>
                    <div class="input-wrapper">
                        <span class="input-icon">⚠️</span>
                        <select class="form-control" name="vision_concerns" required>
                            <option value="">Select an option</option>
                            <option value="None">None (Clear Vision)</option>
                            <option value="Blurry Vision">Occasional / Permanent Blurry Vision</option>
                            <option value="Floaters or Spots">Floaters, Spots, or Cobwebs in Vision</option>
                            <option value="Dark Patches">Dark Patches or Vision Distortion</option>
                        </select>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">
                    Complete Profile & Enter Dashboard →
                </button>
            </form>

            <a href="{{ url_for('patient_register') }}" class="back-link">← Back to Step 1</a>
        </div>
    </main>

</body>
</html>
