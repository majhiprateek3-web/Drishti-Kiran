<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Secure Login | Drishti-किरण</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Kalam:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-dark: #0d9488;
            --primary-light: #ccfbf1;
            --accent: #5eead4;
            --bg-color: #f0fdfa;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#cbd5e1 0.8px, transparent 0.8px);
            background-size: 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Hero Header */
        header {
            background: linear-gradient(135deg, rgba(15, 118, 110, 0.95) 0%, rgba(6, 78, 59, 0.98) 100%), 
                        url('https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=1600&q=80') center/cover;
            color: white;
            padding: 50px 20px 70px 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .brand-title { font-size: 2.8rem; font-weight: 800; margin-bottom: 5px; letter-spacing: -0.5px; }
        .hindi-kiran { font-family: 'Kalam', cursive; color: var(--accent); }
        .subtitle { font-size: 1.1rem; color: #ccfbf1; font-weight: 300; }

        /* Login Container */
        .container {
            max-width: 460px;
            margin: -40px auto 40px auto;
            padding: 0 20px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            padding: 40px 35px;
        }

        .card h2 {
            font-size: 1.5rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .card-desc {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.92rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-main);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            font-size: 1.1rem;
            color: var(--text-muted);
            pointer-events: none;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
            background: #ffffff;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.02rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(15, 118, 110, 0.25);
            transition: all 0.2s ease;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 118, 110, 0.35);
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-home:hover { color: var(--primary); }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.82rem;
        }
    </style>
</head>
<body>

    <!-- Header Banner -->
    <header>
        <h1 class="brand-title">Drishti-<span class="hindi-kiran">किरण</span></h1>
        <p class="subtitle">Ophthalmologist & Clinical Specialist Workspace</p>
    </header>

    <!-- Main Login Card -->
    <main class="container">
        <div class="card">
            <h2>🩺 Doctor Secure Sign In</h2>
            <p class="card-desc">Access AI diagnostic triage queues, review Grad-CAM heatmaps, and verify patient records.</p>

            <form action="{{ url_for('doctor_login') }}" method="POST">
                <div class="form-group">
                    <label>🆔 Medical License / Doctor ID</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🏥</span>
                        <input type="text" class="form-control" placeholder="e.g. DOC-88210" required value="DOC-88210">
                    </div>
                </div>

                <div class="form-group">
                    <label>🔑 Secure Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" class="form-control" placeholder="••••••••" required value="password123">
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    Login to Doctor Dashboard →
                </button>
            </form>

            <a href="{{ url_for('home') }}" class="back-home">← Return to Home Page</a>
        </div>
    </main>

    <footer>
        <p>Drishti-किरण Clinical Tele-Ophthalmology Portal • Encrypted Connection</p>
    </footer>

</body>
</html>
